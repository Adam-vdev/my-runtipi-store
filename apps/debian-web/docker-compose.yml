services:
  debian-web:
    image: lscr.io/linuxserver/webtop:debian-xfce
    container_name: debian-web
    restart: unless-stopped
    shm_size: "1gb"
    security_opt:
      - seccomp:unconfined
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ}
      - TITLE=Debian Web
      - CUSTOM_USER=${DEBIAN_WEB_USER}
      - PASSWORD=${DEBIAN_WEB_PASSWORD}
    volumes:
      - ${APP_DATA_DIR}/data/config:/config
    labels:
      runtipi.managed: true
    # Tells Tipi which port the container serves web UI traffic on internally
    x-runtipi:
      is_main: true
      internal_port: 3000

# Declare the schema version so RunTipi passes the validation test
x-runtipi:
  schema_version: 2

