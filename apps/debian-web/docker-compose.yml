services:
  debian-web:
    image: lscr.io/linuxserver/webtop:debian-xfce
    container_name: debian-web
    restart: unless-stopped
    shm_size: "1gb"
    security_opt:
      - seccomp:unconfined
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ}
      - TITLE=Debian Web
      - CUSTOM_USER=${DEBIAN_WEB_USER}
      - PASSWORD=${DEBIAN_WEB_PASSWORD}
    volumes:
      - ${APP_DATA_DIR}/data/config:/config
    ports:
      - ${APP_PORT}:3000
    networks:
      - tipi_main_network
    labels:
      runtipi.managed: true
